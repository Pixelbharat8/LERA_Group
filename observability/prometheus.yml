# Prometheus — scrapes the 9 Spring services' Micrometer endpoints over the internal
# docker network (docker-compose.https.yml). Everything stays on this host: no data leaves
# the machine, which keeps the metrics inside Vietnam along with the database.
#
# One job per service so `job` is a reliable label in rules and dashboards
# (Micrometer's `application` tag is not configured everywhere).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: identity
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["identity_service:8081"] }]
  - job_name: academy
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["academy_service:8082"] }]
  - job_name: payment
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["payment_service:8083"] }]
  - job_name: payroll
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["payroll_service:8084"] }]
  - job_name: attendance
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["attendance_service:8085"] }]
  - job_name: connect
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["connect_service:8086"] }]
  - job_name: ai_gateway
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["ai_gateway:8087"] }]
  - job_name: rule_engine
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["rule_engine:8088"] }]
  - job_name: social_media
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["social_media_service:8089"] }]
