  ###############################################################
  # Backend Microservice: social_media_service
  ###############################################################
  social_media_service:
    <<: *backend-common
    build: ./backend/social_media_service
    container_name: social_media_service
    networks:
      lera-net:
        aliases:
          - social-media-service   # DNS-legal name: Tomcat 400s on an underscore Host header
    environment:
      <<: *service-urls
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_USER: lera
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Required: identity refuses to start in a deployed profile when this is blank or the
      # legacy default, and service-to-service /api/internal/* calls 503 without it.
      LERA_INTERNAL_API_KEY: ${LERA_INTERNAL_API_KEY:?LERA_INTERNAL_API_KEY is required (openssl rand -base64 24)}
      DB_NAME: lera
    ports:
      - "8089:8089"   # social_media_service runs on port 8089
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8089/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  ###############################################################
  # Frontend (Next.js 14)
  ###############################################################
  frontend:
    build: ./frontend
    container_name: lera_frontend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - lera-net

  ###############################################################
  # API GATEWAY (NGINX Reverse Proxy, unprivileged — listens on 8080)
  ###############################################################
  gateway:
    build: ./gateway
    container_name: lera_gateway
    restart: unless-stopped
    logging: *default-logging
    deploy: *svc-deploy
    ports:
      - "80:8080"
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on 0.0.0.0:8080 (IPv4 only — the base image's
      # ipv6 hook skips a replaced nginx.conf), while `localhost` resolves to ::1 first inside
      # the container, so the check got "connection refused" and reported the gateway unhealthy
      # while it was happily serving traffic.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - frontend
      - academy_service
      - attendance_service
      - connect_service
      - identity_service
      - payment_service
      - payroll_service
      - rule_engine
      - ai_gateway
      - social_media_service
    networks:
      - lera-net


###############################################################
# NETWORKS & VOLUMES
###############################################################
networks:
  lera-net:

volumes:
  postgres_data:
  minio_data:
  lera_uploads:
