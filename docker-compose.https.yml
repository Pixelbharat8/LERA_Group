# Production HTTPS overlay — puts Caddy in front of the gateway and gets a free
# Let's Encrypt certificate automatically. Use ALONGSIDE the base compose:
#
#   DOMAIN=app.your-domain.com docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# Requirements: the server's public IP must have ports 80 + 443 open and DOMAIN's
# DNS A-record must point at it (Caddy needs :80 reachable to solve the ACME challenge).
#
# Prefer not to manage certs yourself? Skip this file and put the domain behind
# Cloudflare (orange-cloud) pointing at the server — the base gateway on :80 is enough.

# =============================================================================
# PROFILE: this overlay switches every backend from `docker` to `prod`.
#
# The base compose runs SPRING_PROFILES_ACTIVE=docker, which is right for local
# containerised development but NOT for a public deployment:
#
#   * 8 of the 9 services inherit `spring.sql.init.mode=always` from
#     application.properties (only identity overrides it in the docker profile),
#     so every boot re-runs data.sql — which inserts FAKE students, teachers,
#     payments, refunds, ledger entries and salaries. Because those rows use
#     gen_random_uuid() ids, ON CONFLICT never matches and the fake data
#     MULTIPLIES on each restart (this is what put 14x duplicate payments in the
#     dev database). The prod profile sets sql.init.mode=never.
#   * Only identity's docker profile pins `lera.cookies.secure` and
#     `lera.security.trusted-proxy`; the prod profile sets them everywhere, which
#     matters because Caddy terminates TLS and forwards X-Forwarded-For.
#   * prod also drops logging to WARN and keeps API-docs off across the board.
#
# The base compose already supplies DB_HOST/DB_NAME/DB_USER/DB_PASSWORD/JWT_SECRET,
# which is everything the prod profile requires.
# =============================================================================
x-prod-profile: &prod-profile
  SPRING_PROFILES_ACTIVE: prod
  # Service-to-service /api/internal/* calls are rejected in prod unless this is set.
  LERA_INTERNAL_API_KEY: ${LERA_INTERNAL_API_KEY:?set LERA_INTERNAL_API_KEY (openssl rand -base64 24)}
  # prod trusts no localhost origin; the mobile shell schemes stay allowed.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${DOMAIN},capacitor://localhost,ionic://localhost}
  # FIRST BOOT ON AN EMPTY DATABASE: run once with SPRING_FLYWAY_ENABLED=false so
  # ddl-auto=update can build the base schema, then again with the default (true)
  # to apply the migration overlays. No migration in this repo creates the base
  # tables, so a first boot with Flyway on dies on
  #   ERROR: relation "course_programs" does not exist
  # `scripts/vps-first-deploy.sh` does both phases for you. See GO_LIVE §3a.
  SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}

# SECURITY: the base compose publishes every service to the host — Postgres on
# 5432, pgAdmin on 5050, MinIO on 9000/9001, all nine APIs on 8081-8089 and the
# frontend on 3000. On a public VPS that puts the production database and admin
# consoles straight on the internet.
#
# A host firewall is NOT sufficient on its own: Docker publishes ports by writing
# its own iptables DOCKER chain, which is evaluated BEFORE ufw's rules, so a
# server "locked down to 80/443 with ufw" still answers on 5432. The reliable fix
# is to not publish the ports at all — containers still reach each other by
# service name on the internal network, which is how the gateway already routes.
#
# Reach an admin console over SSH instead, e.g.:
#   ssh -L 5050:localhost:5050 user@server   # then http://localhost:5050
x-no-published-ports: &no-published-ports
  ports: !reset []

services:
  # The gateway no longer needs a host port; Caddy fronts it on the internal network.
  gateway:
    ports: !reset []

  # Datastores and admin consoles: internal network only.
  postgres:
    <<: *no-published-ports
  pgadmin:
    <<: *no-published-ports
  minio:
    <<: *no-published-ports

  # The frontend is reached through the gateway, never directly.
  frontend:
    <<: *no-published-ports

  identity_service:
    <<: *no-published-ports
    environment: *prod-profile
  academy_service:
    <<: *no-published-ports
    environment: *prod-profile
  payment_service:
    <<: *no-published-ports
    environment: *prod-profile
  payroll_service:
    <<: *no-published-ports
    environment: *prod-profile
  attendance_service:
    <<: *no-published-ports
    environment: *prod-profile
  connect_service:
    <<: *no-published-ports
    environment: *prod-profile
  ai_gateway:
    <<: *no-published-ports
    environment: *prod-profile
  rule_engine:
    <<: *no-published-ports
    environment: *prod-profile
  social_media_service:
    <<: *no-published-ports
    environment: *prod-profile

  caddy:
    image: caddy:2
    container_name: lera-caddy
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your app hostname}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lera-net

volumes:
  caddy_data:
  caddy_config:
