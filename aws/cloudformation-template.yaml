  # ---------------------------------------------------------------------------
  # Frontend — server-rendered Next.js (`npm start`), NOT a static export. It has
  # middleware.ts and route handlers under app/api, so it must run as a service;
  # the S3 bucket below is for uploads/assets only.
  # ---------------------------------------------------------------------------
  FrontendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub lera-frontend-${Environment}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: frontend
          Image: !Sub ${ImageRegistry}/lera_frontend:${ImageTag}
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Name: frontend
              AppProtocol: http
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: '3000'
            # Server-side fetches go direct to the services (server-auth-token.ts
            # throws in production if IDENTITY_SERVICE_URL is unset).
            - Name: IDENTITY_SERVICE_URL
              Value: http://identity_service:8081
            - Name: ACADEMY_SERVICE_URL
              Value: http://academy_service:8082
            - Name: CONNECT_SERVICE_URL
              Value: http://connect_service:8086
            # Browser calls stay same-origin and are routed by the gateway, so the
            # public base URL is deliberately empty.
            - Name: NEXT_PUBLIC_API_BASE_URL
              Value: ''
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  FrontendService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: frontend
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref FrontendTaskDef
      LaunchType: FARGATE
      DesiredCount: !Ref ServiceDesiredCount
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref AppSecurityGroup
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !GetAtt ServiceConnectNamespace.Arn
        Services:
          - PortName: frontend
            DiscoveryName: frontend
            ClientAliases:
              - Port: 3000
                DnsName: frontend

  # ---------------------------------------------------------------------------
  # Gateway (nginx) — the only task behind the ALB. Its upstreams are resolved by
  # nginx at STARTUP, so it cannot boot until every alias above is registered.
  # DependsOn creates it last; if it still loses the race ECS restarts the task
  # until the upstreams resolve.
  # ---------------------------------------------------------------------------
  GatewayTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub lera-gateway-${Environment}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: gateway
          Image: !Sub ${ImageRegistry}/lera_gateway:${ImageTag}
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Name: gateway
              AppProtocol: http
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gateway

  GatewayService:
    Type: AWS::ECS::Service
    DependsOn:
      - AlbListener
      - IdentityService
      - AcademyService
      - PaymentService
      - PayrollService
      - AttendanceService
      - ConnectService
      - AiGatewayService
      - RuleEngineService
      - SocialMediaService
      - FrontendService
    Properties:
      ServiceName: gateway
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref GatewayTaskDef
      LaunchType: FARGATE
      DesiredCount: !Ref ServiceDesiredCount
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref AppSecurityGroup
      LoadBalancers:
        - ContainerName: gateway
          ContainerPort: 8080
          TargetGroupArn: !Ref GatewayTargetGroup
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !GetAtt ServiceConnectNamespace.Arn

Outputs:
  DatabaseEndpoint:
    Description: RDS endpoint
    Value: !GetAtt LeraDatabase.Endpoint.Address
    Export:
      Name: !Sub ${Environment}-DatabaseEndpoint

  FrontendURL:
    Description: Public URL (CloudFront -> ALB -> nginx gateway)
    Value: !Sub https://${CloudFrontDistribution.DomainName}

  LoadBalancerDNS:
    Description: ALB hostname (origin for CloudFront; useful for direct smoke tests)
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  EcsClusterName:
    Description: ECS cluster running the 9 services, the frontend and the gateway
    Value: !Ref EcsCluster
    Export:
      Name: !Sub ${Environment}-EcsCluster

  S3BucketName:
    Description: S3 bucket for uploaded/static assets (served at /uploads/*)
    Value: !Ref FrontendBucket
