AWSTemplateFormatVersion: '2010-09-09'
Description: 'LERA Platform - Complete AWS Infrastructure'

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Database admin password
  
  JWTSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: JWT signing secret

  DBInstanceClass:
    Type: String
    Default: db.t3.small
    Description: RDS instance class (use db.t3.micro only for dev/throwaway)

  DBAllocatedStorage:
    Type: Number
    Default: 50
    MinValue: 20
    Description: RDS allocated storage in GB

  DBName:
    Type: String
    Default: postgres
    Description: >-
      Database to connect to. The RDS instance below sets no DBName, so RDS creates
      the default `postgres` database. Point this at a dedicated `lera` database once
      you have created one (changing DBName on the RDS resource would replace it).

  ImageRegistry:
    Type: String
    Description: >-
      Docker Hub namespace the CI `docker-build` job pushes to (the DOCKER_USERNAME
      secret). Images are <ImageRegistry>/<service>:<ImageTag>.

  ImageTag:
    Type: String
    Default: latest
    Description: Image tag to run. CI pushes `latest`; pin a digest/tag for real releases.

  LeraInternalApiKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared key for service-to-service /api/internal/* calls (LERA_INTERNAL_API_KEY).

  ServiceDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Tasks per backend service. Raise to 2+ for real availability.

  FlywayEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      FIRST DEPLOY ON AN EMPTY DATABASE ONLY: deploy once with 'false', wait for all
      9 services to reach RUNNING (Hibernate ddl-auto=update builds the shared base
      schema), then redeploy with 'true'. No migration anywhere creates the base
      tables — they are all overlays — so with Flyway on from the start the very
      first boot dies on "relation \"course_programs\" does not exist". Every deploy
      after the first uses 'true'. See docs/GO_LIVE_CHECKLIST.md §3a.

# NOTE: the WAFv2 WebACL below uses Scope=CLOUDFRONT, which AWS only allows in the
# us-east-1 region. Deploy this stack (or at least the WebACL) in us-east-1, or split the
# WebACL into a separate us-east-1 stack and pass its ARN in.

Resources:
  # VPC
  LeraVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub lera-vpc-${Environment}

  # Public Subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LeraVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LeraVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  # Private Subnets for RDS
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LeraVPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LeraVPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref LeraVPC
      InternetGatewayId: !Ref InternetGateway

  # Security Group for RDS
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS
      VpcId: !Ref LeraVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup

  # Security Group for App
  # Only the gateway ports (80/443) are public. The microservice ports (8081-8089) are
  # reachable only from within this same security group (the nginx gateway proxies to them
  # over the private network) — they are NOT exposed to the internet.
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for application
      VpcId: !Ref LeraVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  # Self-referencing rule: allow the microservice ports ONLY from instances in this same
  # security group (service-to-service + gateway → service), never from the internet.
  AppInternalServiceIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 8081
      ToPort: 8089
      SourceSecurityGroupId: !Ref AppSecurityGroup

  # RDS Subnet Group
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for LERA RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  # IAM role for RDS enhanced monitoring
  RDSMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

  # RDS PostgreSQL Instance — Multi-AZ, encrypted at rest, deletion-protected.
  LeraDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub lera-db-${Environment}
      DBInstanceClass: !Ref DBInstanceClass
      Engine: postgres
      EngineVersion: '15'
      MasterUsername: lera
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      BackupRetentionPeriod: 7
      MultiAZ: true
      PubliclyAccessible: false
      DeletionProtection: true
      EnablePerformanceInsights: true
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt RDSMonitoringRole.Arn
      Tags:
        - Key: Name
          Value: !Sub lera-db-${Environment}

  # S3 Bucket for Frontend — PRIVATE. Served only through CloudFront via Origin
  # Access Control (OAC). SPA routing is handled by the CloudFront
  # CustomErrorResponses below (403/404 -> /index.html), so no public S3 website
  # endpoint is needed.
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub lera-frontend-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Origin Access Control — lets ONLY this CloudFront distribution read the bucket.
  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub lera-frontend-oac-${Environment}
        Description: OAC for the LERA frontend bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # S3 Bucket Policy — grant read ONLY to the CloudFront service principal for this
  # distribution (no public access).
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # WAFv2 WebACL for CloudFront (Scope=CLOUDFRONT must be created in us-east-1).
  # AWS managed rule sets + a blanket rate limit to blunt scraping / brute force / DDoS.
  FrontendWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub lera-frontend-waf-${Environment}
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub lera-frontend-waf-${Environment}
      Rules:
        - Name: AWSManagedCommon
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-common
        - Name: AWSManagedKnownBadInputs
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-known-bad-inputs
        - Name: RateLimitPerIP
          Priority: 2
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-per-ip

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        WebACLId: !GetAtt FrontendWebACL.Arn
        # The app is server-rendered (Next.js middleware + app/api route handlers +
        # the whole Spring API), so the default origin is the ALB, not S3. The
        # bucket stays as a second origin for uploaded/static assets.
        Origins:
          - DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            Id: AlbOrigin
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: S3Origin
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        Enabled: true
        HttpVersion: http2
        # Dynamic by default: forward everything, cache nothing. Next.js sets its
        # own cache headers for /_next/static, and the APIs are per-user.
        DefaultCacheBehavior:
          TargetOriginId: AlbOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingDisabled / Managed-AllViewer
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        CacheBehaviors:
          - PathPattern: /uploads/*
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            # Managed-CachingOptimized
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  # Centralized application log group (services ship stdout here via the awslogs driver /
  # CloudWatch agent). 30-day retention.
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /lera/${Environment}/application
      RetentionInDays: 30

  # VPC Flow Logs — network-level audit trail for the whole VPC.
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /lera/${Environment}/vpc-flow-logs
      RetentionInDays: 30

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: flow-logs-to-cloudwatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogGroup.Arn

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref LeraVPC
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn

  # ===========================================================================
  # ROUTING — the VPC had an InternetGateway attached but NO route tables, so
  # nothing in it could reach (or be reached from) the internet. Public subnets
  # route via the IGW; private subnets (RDS + all Fargate tasks) egress through
  # a NAT gateway so they can pull images and call VNPay/Anthropic/SMTP.
  # ===========================================================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LeraVPC
      Tags:
        - Key: Name
          Value: !Sub lera-public-rt-${Environment}

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  # COST/HA NOTE: one NAT gateway (~$32/mo + data). It lives in AZ-a, so an AZ-a
  # outage costs private-subnet egress until you add a second NAT in PublicSubnet2
  # with its own private route table.
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LeraVPC
      Tags:
        - Key: Name
          Value: !Sub lera-private-rt-${Environment}

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ===========================================================================
  # LOAD BALANCER — public entry point. Only the nginx gateway sits behind it;
  # the 9 backends and the Next.js frontend are private and reached through the
  # gateway, exactly as in docker-compose.
  # ===========================================================================
  # HARDENING TODO: this allows the whole internet, so the ALB DNS name bypasses
  # CloudFront (and therefore the WAF). Lock it to CloudFront's origin-facing
  # managed prefix list once deployed:
  #   aws ec2 describe-managed-prefix-lists --region <r> \
  #     --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing
  # then swap CidrIp for SourcePrefixListId.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ingress to the LERA ALB
      VpcId: !Ref LeraVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  # Gateway container port, reachable only from the ALB.
  AppGatewayIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  # Next.js port, reachable only from other tasks in the same SG (the gateway).
  AppFrontendIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AppSecurityGroup

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub lera-alb-${Environment}
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup

  GatewayTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub lera-gw-tg-${Environment}
      VpcId: !Ref LeraVPC
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '20'

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GatewayTargetGroup

  # ===========================================================================
  # SECRETS — task definitions reference these by ARN, so the values never
  # appear in the rendered task definition or the ECS console.
  # ===========================================================================
  DbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub lera/${Environment}/db-password
      SecretString: !Ref DBPassword

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub lera/${Environment}/jwt-secret
      SecretString: !Ref JWTSecret

  InternalApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub lera/${Environment}/internal-api-key
      SecretString: !Ref LeraInternalApiKey

  # ===========================================================================
  # ECS — Fargate cluster with Service Connect. The client aliases below
  # reproduce the docker-compose hostnames (academy_service:8082, frontend:3000,
  # …) so gateway/nginx/*.conf needs no changes at all.
  # ===========================================================================
  ServiceConnectNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Sub lera-${Environment}.local
      Vpc: !Ref LeraVPC

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub lera-${Environment}
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      ServiceConnectDefaults:
        Namespace: !GetAtt ServiceConnectNamespace.Arn

  # Pulls images and writes logs. Also reads the three secrets above.
  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-lera-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbPasswordSecret
                  - !Ref JwtSecret
                  - !Ref InternalApiKeySecret

  # The role the application itself runs as: S3 uploads + ECS Exec shell access.
  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lera-task-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${FrontendBucket.Arn}/*
              # ECS Exec (`aws ecs execute-command`) — invaluable on first deploy.
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

  # ---------------------------------------------------------------------------
  # Backend services (9). Each binds the port its own application-prod.properties
  # defaults to (server.port=${PORT:80xx}), so PORT is deliberately NOT set here —
  # the container port below is that default.
  # ---------------------------------------------------------------------------
  IdentityTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub lera-identity-${Environment}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: identity
          Image: !Sub ${ImageRegistry}/identity_service:${ImageTag}
          Essential: true
          PortMappings:
            - ContainerPort: 8081
              Name: identity
              AppProtocol: http
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: prod
            - Name: SPRING_FLYWAY_ENABLED
              Value: !Ref FlywayEnabled
            - Name: DB_HOST
              Value: !GetAtt LeraDatabase.Endpoint.Address
            - Name: DB_PORT
              Value: '5432'
            - Name: DB_NAME
              Value: !Ref DBName
            - Name: DB_USER
              Value: lera
            - Name: IDENTITY_SERVICE_URL
              Value: http://identity_service:8081
            - Name: ACADEMY_SERVICE_URL
              Value: http://academy_service:8082
            - Name: CONNECT_SERVICE_URL
              Value: http://connect_service:8086
            - Name: FRONTEND_URL
              Value: !Sub https://${CloudFrontDistribution.DomainName}
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Ref DbPasswordSecret
            - Name: JWT_SECRET
              ValueFrom: !Ref JwtSecret
            - Name: LERA_INTERNAL_API_KEY
              ValueFrom: !Ref InternalApiKeySecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: identity

  IdentityService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: identity_service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref IdentityTaskDef
      LaunchType: FARGATE
      DesiredCount: !Ref ServiceDesiredCount
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref AppSecurityGroup
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !GetAtt ServiceConnectNamespace.Arn
        Services:
          - PortName: identity
            DiscoveryName: identity
            ClientAliases:
              - Port: 8081
                DnsName: identity_service

  AcademyTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub lera-academy-${Environment}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: academy
          Image: !Sub ${ImageRegistry}/academy_service:${ImageTag}
          Essential: true
          PortMappings:
            - ContainerPort: 8082
              Name: academy
              AppProtocol: http
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: prod
            - Name: SPRING_FLYWAY_ENABLED
              Value: !Ref FlywayEnabled
            - Name: DB_HOST
              Value: !GetAtt LeraDatabase.Endpoint.Address
            - Name: DB_PORT
              Value: '5432'
            - Name: DB_NAME
              Value: !Ref DBName
            - Name: DB_USER
              Value: lera
            - Name: IDENTITY_SERVICE_URL
              Value: http://identity_service:8081
            - Name: ACADEMY_SERVICE_URL
              Value: http://academy_service:8082
            - Name: CONNECT_SERVICE_URL
              Value: http://connect_service:8086
            - Name: FRONTEND_URL
              Value: !Sub https://${CloudFrontDistribution.DomainName}
            - Name: LERA_STORAGE_S3_BUCKET
              Value: !Ref FrontendBucket
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Ref DbPasswordSecret
            - Name: JWT_SECRET
              ValueFrom: !Ref JwtSecret
            - Name: LERA_INTERNAL_API_KEY
              ValueFrom: !Ref InternalApiKeySecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: academy

  AcademyService:
    Type: AWS::ECS::Service
    Properties:
