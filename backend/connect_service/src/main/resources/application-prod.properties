# =============================================
# Connect Service — PRODUCTION Configuration
# Activate with: --spring.profiles.active=prod
# =============================================

server.port=${PORT:8086}
spring.application.name=connect-service

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA — Hibernate builds/reconciles the schema; Flyway applies the overlays.
# ddl-auto MUST stay `update` in prod: some migrations (e.g. academy's
# V20260701) deliberately DROP type-drifted tables and rely on Hibernate
# recreating them on the SAME boot. Under `validate` they stay missing and the
# service dies at startup. See docs/GO_LIVE_CHECKLIST.md §3 (verified 2026-07-08).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

spring.sql.init.mode=never

# Schema owned by Flyway (device_tokens, CRM indexes, etc.) — applied before Hibernate reconciles.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_connect_history

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

logging.level.root=WARN
logging.level.com.lera.connect_service=INFO
logging.level.org.springframework.web=WARN

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# SECURITY: no API-docs/Swagger surface in prod.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
