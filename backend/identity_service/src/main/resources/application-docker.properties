# Docker/deploy profile overrides for identity_service.
#
# SECURITY: do NOT run data.sql in a deployed environment. data.sql seeds sample accounts
# (Chairman/CEO/admin) with publicly-known passwords (admin123/password123) for local dev only.
# In docker/prod, DataLoader creates those accounts with passwords from LERA_SEED_* env vars
# (or a random, logged password if unset) — never the weak seed values. Matches application-prod.
spring.sql.init.mode=never
