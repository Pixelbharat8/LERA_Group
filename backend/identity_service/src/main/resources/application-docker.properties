# Docker/deploy profile overrides for identity_service.
#
# SECURITY: do NOT run data.sql in a deployed environment. data.sql seeds sample accounts
# (Chairman/CEO/admin) with publicly-known passwords (admin123/password123) for local dev only.
# In docker/prod, DataLoader creates those accounts with passwords from LERA_SEED_* env vars
# (or a random, logged password if unset) — never the weak seed values. Matches application-prod.
spring.sql.init.mode=never

# SECURITY: no API-docs/swagger surface in deployed profiles (api inventory disclosure).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# SECURITY: pin the Secure flag on the HttpOnly JWT cookies so a missing env override
# can never send them over cleartext HTTP. (Deployed profiles are always behind TLS.)
lera.cookies.secure=true

# Deployed behind a reverse proxy/CDN that sets X-Forwarded-For — trust it for client-IP
# rate limiting. The proxy MUST overwrite (not append) XFF with the real client IP.
lera.security.trusted-proxy=true
