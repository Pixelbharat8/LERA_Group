# =============================================
# Identity Service — PRODUCTION Configuration
# Activate with: --spring.profiles.active=prod
# =============================================

server.port=${PORT:8081}
spring.application.name=identity-service

# Database — all values from environment
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA — Hibernate builds/reconciles the schema; Flyway applies the overlays.
# ddl-auto MUST stay `update` in prod: some migrations (e.g. academy's
# V20260701) deliberately DROP type-drifted tables and rely on Hibernate
# recreating them on the SAME boot. Under `validate` they stay missing and the
# service dies at startup. See docs/GO_LIVE_CHECKLIST.md §3 (verified 2026-07-08).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

# Schema migrations run before Hibernate reconciles (custom_fields, etc.).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_identity_history

# Disable SQL initialization in production
spring.sql.init.mode=never

# JWT — must be set via environment
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Logging
logging.level.root=WARN
logging.level.com.lera.identity_service=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# SECURITY: no API-docs/swagger surface in deployed profiles (api inventory disclosure).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# SECURITY: pin the Secure flag on the HttpOnly JWT cookies so a missing env override
# can never send them over cleartext HTTP. (Deployed profiles are always behind TLS.)
lera.cookies.secure=true

# Deployed behind a reverse proxy/CDN that sets X-Forwarded-For — trust it for client-IP
# rate limiting. The proxy MUST overwrite (not append) XFF with the real client IP.
lera.security.trusted-proxy=true
