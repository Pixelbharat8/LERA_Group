# =============================================
# Rule Engine — PRODUCTION Configuration
# Activate with: --spring.profiles.active=prod
# =============================================

server.port=${PORT:8088}
spring.application.name=rule-engine

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA — Hibernate builds/reconciles the schema; Flyway applies the overlays.
# ddl-auto MUST stay `update` in prod: some migrations (e.g. academy's
# V20260701) deliberately DROP type-drifted tables and rely on Hibernate
# recreating them on the SAME boot. Under `validate` they stay missing and the
# service dies at startup. See docs/GO_LIVE_CHECKLIST.md §3 (verified 2026-07-08).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_rule_engine_history

spring.sql.init.mode=never

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

logging.level.root=WARN
logging.level.com.lera.rule_engine=INFO
logging.level.org.springframework.web=WARN

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# SECURITY: no API-docs/swagger surface in deployed profiles (api inventory disclosure).
# SECURITY: deployed profiles must NOT trust http://localhost. CORS here runs with
# allowCredentials=true, so a localhost origin would let anything bound to :3000 on a
# user's machine call the live API with that user's cookies. capacitor:// and ionic://
# are app schemes rather than network origins, so they stay allowed for the mobile shell.
# Set CORS_ALLOWED_ORIGINS at deploy time to add the CloudFront/custom domain.
lera.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.leraacademy.edu.vn,capacitor://localhost,ionic://localhost}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
